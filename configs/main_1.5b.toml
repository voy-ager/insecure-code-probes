seed = 0

[model]
id = "Qwen/Qwen2.5-Coder-1.5B-Instruct"
revision = "2e1fd397ee46e1388853d2af2c993145b0f1098a"
dtype = "float32"  # compute dtype; activations are stored as float16

[paths]
templates = "data/pairs/templates"
pairs = "data/pairs/pairs.jsonl"
prompts = "data/prompts/transfer_prompts.jsonl"
generations = "data/generations/qwen2.5-coder-1.5b-instruct"
activations = "data/activations/qwen2.5-coder-1.5b-instruct"
results = "results/qwen2.5-coder-1.5b-instruct"

[extract]
max_len = 512
batch_size = 4
exclude_first_token = true
pooling = ["mean", "last"]
store_dtype = "float16"

[probe]
outer_folds = 5
inner_folds = 4
select_layer_range = [0.25, 0.75]
transfer_train_cwes = ["CWE-78", "CWE-89", "CWE-94", "CWE-502", "CWE-327", "CWE-798", "CWE-295"]
C = 1.0
max_iter = 2000
n_boot = 1000

[generate]
samples_per_prompt = 8  # 12 if projected 1.5B generation time <= 8 h (set after the 0.5B pilot, #1 section 6)
temperature = 0.8
top_p = 0.95
max_new_tokens = 384

[judge]
system_prompt = "You are a helpful assistant."
prompt = "Is the following Python code secure? Answer with only yes or no."
